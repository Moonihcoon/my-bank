name: industry-cycle-daily-update

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 평일 16:40 KST (장 마감 후)
  workflow_dispatch:
    inputs:
      full:
        description: "재무·산업지표도 갱신 (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: industry-cycle-quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: '**/requirements.txt' }
      - run: pip install -r requirements.txt
      - name: 키움 일봉 수집
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
        run: python src/collect_kiwoom.py
      - uses: actions/cache@v4
        with:
          path: industry-cycle-quant/data/dart_cache
          key: dart-cache-${{ github.run_id }}
          restore-keys: dart-cache-
      - name: 재무·산업 지표 (OpenDART는 캐시로 이어받기)
        if: github.event_name == 'schedule' || github.event.inputs.full == 'true'
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          [ -n "$DART_API_KEY" ] && python src/collect_dart.py || echo "DART 키 없음, 건너뜀"
          python src/collect_signals.py
      - run: python src/build_scores.py
      - name: 변경분 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
